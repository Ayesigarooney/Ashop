name: ashop
description: Ashop - Smart Shop Manager & POS for small businesses
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Dependency Injection
  get_it: ^7.6.0

  # Navigation
  go_router: ^12.1.1

  # UI & Icons
  google_fonts: ^6.1.0
  fl_chart: ^0.65.0

  # Barcode Scanner
  mobile_scanner: ^3.5.6

  # PDF
  pdf: ^3.10.7
  printing: ^5.11.1
  path_provider: ^2.1.1

  # Image Picker
  image_picker: ^1.0.4

  # Utils
  intl: ^0.18.1
  uuid: ^4.2.1
  share_plus: ^7.2.1
  flutter_secure_storage: ^9.0.0
  csv: ^5.0.2
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.7
  flutter_lints: ^3.0.0
  mockito: ^5.4.3
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/image/
    - assets/icon/

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0F172A"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  remove_alpha_ios: true
